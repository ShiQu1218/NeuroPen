name: Bug report
description: Report a reproducible problem in NeuroPen
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal repro and mention the affected OpenSpec capability if you know it.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug.
      placeholder: The preview window stays blank after a Quick Action completes.
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Affected capability
      description: Pick the closest OpenSpec capability area.
      options:
        - application-shell
        - history-and-privacy
        - llm-preview-and-screenshot
        - local-models-and-tts
        - selection-and-injection
        - settings-and-profiles
        - voice-routing
        - not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a deterministic repro when possible.
      placeholder: |
        1. Open Notepad
        2. Select text
        3. Trigger Quick Action
        4. Observe the failure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.2.6
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, local/cloud model, and any notable setup details.
      placeholder: Windows 11 24H2, OpenAI provider, preview output mode
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste short logs or attach screenshots if they help. Remove secrets first.
